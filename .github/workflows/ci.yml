name: VaultStore checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: test -z "$(gofmt -l cmd internal migrations tests)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./cmd/...
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: python scripts/setup.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait postgres kafka minio
      - run: python scripts/integration.py
      - run: docker compose up -d api worker scheduler frontend
      - run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/v1/ready && break; sleep 2; done
          python scripts/demo.py --crash
      - if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: compose-logs, path: compose.log}
      - if: always()
        run: docker compose down -v
