global:
  scrape_interval: 15s
scrape_configs:
  - job_name: vaultstore-api
    static_configs:
      - targets: ['api:8080']
  - job_name: vaultstore-worker
    static_configs:
      - targets: ['worker:8080']
  - job_name: vaultstore-scheduler
    static_configs:
      - targets: ['scheduler:8080']
