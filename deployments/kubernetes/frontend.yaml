apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultstore-frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: vaultstore-frontend}
  template:
    metadata:
      labels: {app: vaultstore-frontend}
    spec:
      containers:
        - name: frontend
          image: vaultstore-frontend:1.0.0
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          livenessProbe:
            httpGet: {path: /, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: vaultstore-frontend
spec:
  selector: {app: vaultstore-frontend}
  ports: [{port: 80, targetPort: 8080}]
